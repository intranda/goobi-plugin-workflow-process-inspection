<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:composite="http://xmlns.jcp.org/jsf/composite"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:pt="http://xmlns.jcp.org/jsf/passthrough"
    xmlns:jsf="http://xmlns.jcp.org/jsf"
    xmlns:c="http://java.sun.com/jstl/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
    xmlns:intranda="http://xmlns.jcp.org/jsf/composite/composites"
    xmlns:section="http://goobi.io/section"
    xmlns:table="http://goobi.io/table"
    xmlns:dl="http://goobi.io/dl">

    <composite:interface>
    </composite:interface>

    <composite:implementation>



        <style>
table.select>tbody tr {
    display: flex;
    flex-direction: column;
    padding: 8px;
    justify-content: flex-start;
}

table.select>tbody tr td {
    padding: 0px;
    border: 0;
}

table.select>tbody tr td label {
    margin-left: 10px;
}

.searchRow {
    display: flex;
    gap: 4px;
    justify-content: flex-end;
}

.flexField {
    flex: 0 1 25%;
}

.smallertablecell {
    padding: 4px !important;
}

.dataTables__filters::after {
    content: "";
    clear: both;
    display: table;
}

.dataTables__table {
    overflow-y: scroll;
}

td button i.margin-right-5 {
    display: inline;
}

/* Utilities */
.fw-bold {
    font-weight: bold;
}

.fulltext-output {
    max-width: 480px;
    min-width: 240px;
    border: 1px solid #ccc;
    border-radius: 4px;
    padding: 8px;
    background-color: #f1f3f4;
    font-family: monospace;
}

td .actions-table {
    width: 200px;
}

.border-top {
    border-top: 1px solid #ddd;
}
</style>

        <h:form
            styleClass="form-horizontal form-bordered"
            id="searchform">
            <!-- search field -->
            <section:section type="primary">
                <section:header
                    icon="compass"
                    title="#{myPageTitle}"></section:header>
                <section:body>
                    <!-- search box -->
                    <table:wrapper>
                        <table:search>
                            <table:hits>
                                <h:outputText value="#{msgs.treffer}: #{NavigationForm.workflowPlugin.processPaginator.totalResults}" />
                            </table:hits>
                            <table:filter>
                                <h:selectOneMenu
                                    id="searchoption_select"
                                    styleClass="form-select w-25"
                                    value="#{NavigationForm.workflowPlugin.selectedField}"
                                    pt:aria-label="searchfield">
                                    <f:selectItem
                                        itemValue=""
                                        itemLabel="#{msgs.plugin_dashboard_delivery_anyField}" />
                                    <f:selectItems value="#{NavigationForm.workflowPlugin.metadataFields}" />
                                </h:selectOneMenu>
                                <table:filter-input>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <span
                                                aria-hidden="true"
                                                class="fa fa-search" />
                                        </span>
                                        <h:inputText
                                            id="searchvalue_input"
                                            pt:aria-label="searchvalue"
                                            styleClass="form-control searchfield"
                                            value="#{NavigationForm.workflowPlugin.searchValue}">
                                            <f:passThroughAttribute
                                                name="placeholder"
                                                value="#{msgs.plugin_workflow_processinspection_searchterm}" />
                                            <f:passThroughAttribute
                                                name="aria-label"
                                                value="#{msgs.plugin_workflow_processinspection_searchterm}" />
                                        </h:inputText>
                                        <button
                                            jsf:id="newSearch"
                                            jsf:forceId="true"
                                            class="btn btn-blank"
                                            jsf:action="#{NavigationForm.workflowPlugin.loadProcesses}">#{msgs.search}</button>
                                    </div>
                                </table:filter-input>
                            </table:filter>
                        </table:search>
                        <table:table id="processInspectionTable">
                            <thead>
                                <tr role="row">

                                    <!-- THUMBNAIL -->
                                    <th
                                        scope="col"
                                        role="columnheader"
                                        class="tableColumnOverflow"
                                        style="width: 200px;">
                                        <h:outputText value="#{msgs.plugin_workflow_processinspection_image}" />
                                    </th>

                                    <!-- PROCESS NAMW -->
                                    <th
                                        scope="col"
                                        role="columnheader"
                                        class="tableColumnOverflow maxWidth300"
                                        aria-sort="#{NavigationForm.workflowPlugin.sortField== 'titelDesc' ? 'descending' : NavigationForm.workflowPlugin.sortField== 'titelAsc' ? 'ascending' :'none'}">
                                        <button
                                            class="column-header-sort"
                                            style="width: 100%; text-align: left;"
                                            jsf:action="#{NavigationForm.workflowPlugin.loadProcesses}"
                                            aria-label="#{msgs.defaultSortField} #{msgs.prozessTitel} #{NavigationForm.workflowPlugin.sortField== 'titelDesc' ? msgs.defaultSortFieldDesc : NavigationForm.workflowPlugin.sortField== 'titelAsc' ? msgs.defaultSortFieldAsc : msgs.defaultSortFieldNotSorted }">
                                            <h:outputText value="#{msgs.prozessTitel}" />
                                            <span
                                                class="pull-right table-sort-icon fa #{NavigationForm.workflowPlugin.sortField== 'titelDesc' ?'fa-sort-desc':NavigationForm.workflowPlugin.sortField== 'titelAsc' ?'fa-sort-asc':'fa-sort'}"></span>
                                            <f:setPropertyActionListener
                                                target="#{NavigationForm.workflowPlugin.sortField}"
                                                value="#{NavigationForm.workflowPlugin.sortField== 'titelAsc' ? 'titelDesc' : 'titelAsc' }" />
                                            <f:ajax render="@form" />
                                        </button>
                                    </th>

                                    <!-- PROCESS DATE -->
                                    <th
                                        scope="col"
                                        role="columnheader"
                                        class="tableColumnOverflow maxWidth200"
                                        aria-sort="#{NavigationForm.workflowPlugin.sortField== 'creationDateDesc' ? 'descending' : NavigationForm.workflowPlugin.sortField== 'creationDateAsc' ? 'ascending' :'none'}">
                                        <button
                                            class="column-header-sort"
                                            style="width: 100%; text-align: left;"
                                            jsf:action="#{NavigationForm.workflowPlugin.loadProcesses}"
                                            aria-label="#{msgs.defaultSortField} #{msgs.prozessTitel} #{NavigationForm.workflowPlugin.sortField== 'creationDateDesc' ? msgs.defaultSortFieldDesc : BenutzerverwaltungForm.sortierung== 'creationDateAsc' ? msgs.defaultSortFieldAsc : msgs.defaultSortFieldNotSorted }">
                                            <h:outputText value="#{msgs.vorgangsdatum}" />
                                            <span
                                                class="pull-right table-sort-icon fa #{NavigationForm.workflowPlugin.sortField== 'creationDateDesc' ?'fa-sort-desc':NavigationForm.workflowPlugin.sortField== 'creationDateAsc' ?'fa-sort-asc':'fa-sort'}"></span>
                                            <f:setPropertyActionListener
                                                target="#{NavigationForm.workflowPlugin.sortField}"
                                                value="#{NavigationForm.workflowPlugin.sortField== 'creationDateAsc' ? 'creationDateDesc' : 'creationDateAsc' }" />
                                            <f:ajax render="@form" />
                                        </button>
                                    </th>

                                    <!-- EMBEDDED METADATA -->
                                    <intranda:columnheader
                                        addClass="tableColumnOverflow maxWidth300"
                                        value="#{msgs.metadata}"
                                        sortable="false" />

                                    <!-- FULLTEXT -->
                                    <th
                                        scope="col"
                                        role="columnheader"
                                        class="tableColumnOverflow process-table__header--fulltext"
                                        style="width: 500px;">

                                        <h:outputText value="#{msgs.plugin_workflow_processinspection_fulltext}" />
                                    </th>

                                    <!-- ACTION -->
                                    <intranda:columnheader
                                        style="width:200px"
                                        value="#{msgs.auswahl}"
                                        sortable="false" />
                                </tr>
                            </thead>
                            <ui:repeat
                                var="process"
                                value="#{NavigationForm.workflowPlugin.processPaginator.list}"
                                varStatus="status">
                                <tr role="row">

                                    <!-- THUMBNAIL -->
                                    <td>
                                        <canvas
                                            class="thumb-canvas"
                                            data-image_small="#{process.getThumbnailUrl(250)}"
                                            data-image_large="#{process.getThumbnailUrl(750)}"
                                            id="thumbnail-#{process.process.id}">
                                    </canvas>
                                    </td>

                                    <!-- PROCESS NAME -->
                                    <td>
                                        <button
                                            type="button"
                                            class="btn btn--plusMinus text-start"
                                            jsf:rendered="#{!process.process.panelAusgeklappt}"
                                            title="#{process.process.titel}"
                                            jsf:id="displayDetails"
                                            aria-haspopup="true"
                                            aria-expanded="false">
                                            <span class="fa fa-angle-right"></span>
                                            <span> #{process.process.titelLokalisiert} </span>
                                            <f:setPropertyActionListener
                                                target="#{process.process.panelAusgeklappt}"
                                                value="true" />
                                            <f:ajax render="@form" />
                                        </button>

                                        <button
                                            type="button"
                                            class="btn btn--plusMinus text-start"
                                            jsf:rendered="#{process.process.panelAusgeklappt}"
                                            title="#{process.process.titel}"
                                            jsf:id="hideDetails"
                                            aria-haspopup="true"
                                            aria-expanded="true">
                                            <span class="fa fa-angle-down"></span>
                                            <span> #{process.process.titelLokalisiert} </span>
                                            <f:setPropertyActionListener
                                                target="#{process.process.panelAusgeklappt}"
                                                value="false" />
                                            <f:ajax render="@form" />
                                        </button>

                                        <h:panelGroup rendered="#{process.process.panelAusgeklappt}">
                                            <section:section type="outline">
                                                <section:header
                                                    icon="list"
                                                    title="#{msgs.details}" />
                                                <section:body>
                                                    <h:dataTable
                                                        styleClass="table table-hover table-bordered"
                                                        id="prozessdetails"
                                                        var="step"
                                                        value="#{process.process.schritteList}">

                                                        <h:column>
                                                            <f:facet name="header">
                                                                <h:outputText value="#{msgs.nr}" />
                                                            </f:facet>
                                                            <h:outputText
                                                                value="#{step.reihenfolge}"
                                                                styleClass="#{step.bearbeitungsstatusEnum == 'DEACTIVATED'?'font-light':''}" />
                                                        </h:column>

                                                        <h:column>
                                                            <f:facet name="header">
                                                                <h:outputText
                                                                    value="#{msgs.titel}"
                                                                    style="white-space: normal;" />
                                                            </f:facet>
                                                            <h:panelGroup rendered="#{step.typAutomatisch}">
                                                                <i
                                                                    class="fa fa-cogs font-light margin-right-10"
                                                                    title="#{msgs.automatischerSchritt}" />
                                                            </h:panelGroup>
                                                            <h:panelGroup rendered="#{not step.typAutomatisch}">
                                                                <i
                                                                    class="fa fa-user-o font-light margin-right-10"
                                                                    title="#{msgs.normalerSchritt}" />
                                                            </h:panelGroup>
                                                            <h:outputText
                                                                value="#{step.titelLokalisiert}"
                                                                title="#{step.titel}"
                                                                style="white-space: normal;"
                                                                styleClass="#{step.reihenfolge}_id #{step.bearbeitungsstatusEnum == 'DEACTIVATED'?'font-light':''}" />
                                                        </h:column>

                                                        <h:column>
                                                            <f:facet name="header">
                                                                <h:outputText value="#{msgs.status}" />
                                                            </f:facet>

                                                            <ul class="colors small13">
                                                                <h:panelGroup rendered="#{step.bearbeitungsstatusEnum == 'LOCKED'}">
                                                                    <li
                                                                        class="statusSmall #{(LoginForm.myBenutzer.uiMode=='low_vision'?('easy-read-'):('')).concat(step.bearbeitungsstatusEnum.color)}"
                                                                        title="#{msgs.statusGesperrt}"
                                                                        rel="tooltip" />
                                                                </h:panelGroup>
                                                                <h:panelGroup rendered="#{step.bearbeitungsstatusEnum == 'OPEN'}">
                                                                    <li
                                                                        class="statusSmall #{(LoginForm.myBenutzer.uiMode=='low_vision'?('easy-read-'):('')).concat(step.bearbeitungsstatusEnum.color)}"
                                                                        title="#{msgs.statusOffen}"
                                                                        rel="tooltip" />
                                                                </h:panelGroup>

                                                                <h:panelGroup
                                                                    rendered="#{step.bearbeitungsstatusEnum == 'DONE' and HelperForm.anonymized}">
                                                                    <li
                                                                        class="statusSmall #{(LoginForm.myBenutzer.uiMode=='low_vision'?('easy-read-'):('')).concat(step.bearbeitungsstatusEnum.color)}"
                                                                        rel="tooltip"
                                                                        title="#{step.bearbeitungsstatusEnum.title} #{step.editTypeEnum.title}" />
                                                                </h:panelGroup>
                                                                <h:panelGroup
                                                                    rendered="#{step.bearbeitungsstatusEnum == 'INWORK' and HelperForm.anonymized}">
                                                                    <li
                                                                        class="statusSmall #{(LoginForm.myBenutzer.uiMode=='low_vision'?('easy-read-'):('')).concat(step.bearbeitungsstatusEnum.color)}"
                                                                        rel="tooltip"
                                                                        title="#{step.bearbeitungsstatusEnum.title}: #{step.editTypeEnum.title}" />
                                                                </h:panelGroup>

                                                                <h:panelGroup
                                                                    rendered="#{step.bearbeitungsstatusEnum == 'DONE' and !HelperForm.anonymized}">
                                                                    <li
                                                                        class="statusSmall #{(LoginForm.myBenutzer.uiMode=='low_vision'?('easy-read-'):('')).concat(step.bearbeitungsstatusEnum.color)}"
                                                                        rel="tooltip"
                                                                        title="#{step.bearbeitungsstatusEnum.title}: #{step.bearbeitungsbenutzer!=null and step.bearbeitungsbenutzer.id!=0?step.bearbeitungsbenutzer.nachVorname:''} (#{step.bearbeitungszeitpunkt !=null?step.bearbeitungszeitpunktAsFormattedString:''})  - #{step.editTypeEnum.title}" />
                                                                </h:panelGroup>
                                                                <h:panelGroup
                                                                    rendered="#{step.bearbeitungsstatusEnum == 'INWORK' and !HelperForm.anonymized}">
                                                                    <li
                                                                        class="statusSmall #{(LoginForm.myBenutzer.uiMode=='low_vision'?('easy-read-'):('')).concat(step.bearbeitungsstatusEnum.color)}"
                                                                        rel="tooltip"
                                                                        title="#{step.bearbeitungsstatusEnum.title}: #{step.bearbeitungsbenutzer!=null and step.bearbeitungsbenutzer.id!=0?step.bearbeitungsbenutzer.nachVorname:''} (#{step.bearbeitungszeitpunkt !=null?step.bearbeitungszeitpunktAsFormattedString:''})  - #{step.editTypeEnum.title}" />
                                                                </h:panelGroup>
                                                                <h:panelGroup
                                                                    rendered="#{step.bearbeitungsstatusEnum == 'ERROR' and !HelperForm.anonymized}">
                                                                    <li
                                                                        class="statusSmall #{(LoginForm.myBenutzer.uiMode=='low_vision'?('easy-read-'):('')).concat(step.bearbeitungsstatusEnum.color)}"
                                                                        rel="tooltip"
                                                                        title="#{step.bearbeitungsstatusEnum.title}: #{step.bearbeitungsbenutzer!=null and step.bearbeitungsbenutzer.id!=0?step.bearbeitungsbenutzer.nachVorname:''} (#{step.bearbeitungszeitpunkt !=null?step.bearbeitungszeitpunktAsFormattedString:''})  - #{step.editTypeEnum.title}" />
                                                                </h:panelGroup>
                                                                <h:panelGroup
                                                                    rendered="#{step.bearbeitungsstatusEnum == 'ERROR' and HelperForm.anonymized}">
                                                                    <li
                                                                        class="statusSmall #{(LoginForm.myBenutzer.uiMode=='low_vision'?('easy-read-'):('')).concat(step.bearbeitungsstatusEnum.color)}"
                                                                        rel="tooltip"
                                                                        title="#{step.bearbeitungsstatusEnum.title}: #{step.editTypeEnum.title}" />
                                                                </h:panelGroup>

                                                                <h:panelGroup rendered="#{step.bearbeitungsstatusEnum == 'DEACTIVATED'}">
                                                                    <li
                                                                        class="statusSmall #{(LoginForm.myBenutzer.uiMode=='low_vision'?('easy-read-'):('')).concat(step.bearbeitungsstatusEnum.color)}"
                                                                        title="#{step.bearbeitungsstatusEnum.title}"
                                                                        rel="tooltip" />
                                                                </h:panelGroup>

                                                                <h:panelGroup rendered="#{step.bearbeitungsstatusEnum == 'INFLIGHT'}">
                                                                    <li
                                                                        class="statusSmall #{(LoginForm.myBenutzer.uiMode=='low_vision'?('easy-read-'):('')).concat(step.bearbeitungsstatusEnum.color)}"
                                                                        title="#{msgs.statusInFlight}"
                                                                        data-toggle="tooltip"></li>
                                                                </h:panelGroup>
                                                            </ul>
                                                            <h:outputText
                                                                value="#{step.bearbeitungsstatusEnum.title}"
                                                                rendered="#{LoginForm.myBenutzer.uiMode=='low_vision'}" />
                                                        </h:column>

                                                    </h:dataTable>
                                                </section:body>
                                            </section:section>

                                        </h:panelGroup>

                                    </td>

                                    <!-- PROCESS DATE -->
                                    <td>
                                        <h:outputText value="#{process.process.erstellungsdatumAsString}">
                                        </h:outputText>
                                    </td>

                                    <!-- EMBEDDED METADATA -->
                                    <td>
                                        <dl:list bordered="false">

                                            <ui:repeat
                                                var="metadata"
                                                value="#{NavigationForm.workflowPlugin.metadataList}"
                                                varStatus="metadatastatus"
                                                id="metadatalist">
                                                <ui:fragment rendered="#{process.getMetadataValue(metadata) != ''}">
                                                    <dl:term>
                                                        #{msgs['process_grid_'.concat(metadata)]}:
                                                    </dl:term>
                                                    <dl:description>
                                                        #{process.getAllMetadataValues(metadata)}
                                                    </dl:description>
                                                </ui:fragment>
                                            </ui:repeat>
                                            <ui:repeat
                                                var="propName"
                                                value="#{NavigationForm.workflowPlugin.propertyList}"
                                                varStatus="propertystatus"
                                                id="propertyList">
                                                <ui:repeat
                                                    var="property"
                                                    value="#{process.process.eigenschaften}">
                                                    <ui:fragment rendered="#{propertystatus.first}">
                                                        <hr class="w-100" />
                                                        <hr class="w-100" />
                                                    </ui:fragment>
                                                    <ui:fragment rendered="#{property.titel eq propName and property.wert != ''}">
                                                        <dl:term>
                                                            #{msgs['process_grid_'.concat(propName)]}:
                                                        </dl:term>
                                                        <dl:description>
                                                            #{property.wert}
                                                        </dl:description>
                                                    </ui:fragment>
                                                </ui:repeat>
                                            </ui:repeat>
                                        </dl:list>
                                    </td>

                                    <!-- FULLTEXT -->
                                    <td>

                                        <div
                                            class="fulltext-output"
                                            jsf:rendered="#{not empty process.fulltext}">
                                            <h:outputText
                                                style="word-break: break-word; hyphens: auto;"
                                                value="#{process.fulltext}"
                                                escape="false" />
                                        </div>
                                    </td>

                                    <!-- BUTTONS -->
                                    <td class="width200">
                                        <h:selectOneRadio
                                            value="#{process.selectedAction}"
                                            styleClass="select-radio select-radio-vertical"
                                            id="select">
                                            <f:selectItems
                                                var="item"
                                                value="#{NavigationForm.workflowPlugin.options}"
                                                itemLabel="#{item.label}"
                                                itemValue="#{item.label}" />
                                            <f:ajax
                                                execute="@this"
                                                render="@this" />
                                        </h:selectOneRadio>
                                    </td>
                                </tr>
                            </ui:repeat>
                        </table:table>
                    </table:wrapper>
                </section:body>
                <section:footer>
                    <div class="dataTables__paginator">
                        <ui:fragment id="zdb_paginator">
                            <!-- paginator -->
                            <h:panelGroup
                                layout="block"
                                rendered="#{NavigationForm.workflowPlugin.processPaginator.totalResults > LoginForm.myBenutzer.tabellengroesse}">
                                <button
                                    class="btn btn-blank"
                                    aria-label="#{msgs.firstPage}"
                                    jsf:action="#{NavigationForm.workflowPlugin.processPaginator.cmdMoveFirst}"
                                    jsf:id="navfirst">
                                    <span class="fa fa-angle-double-left"></span>
                                    <f:ajax render="@form" />
                                </button>
                                <button
                                    class="btn btn-primary"
                                    jsf:action="#{NavigationForm.workflowPlugin.processPaginator.cmdMovePrevious}"
                                    jsf:id="navprev">
                                    <span class="fa fa-angle-left"></span>
                                    <h:outputText value=" #{msgs.pagePrevious}" />
                                    <f:ajax render="@form" />
                                </button>

                                <div class="dataTables__paginator__page-count">
                                    <!-- aktuelle Seite anzeigen -->
                                    <button
                                        type="button"
                                        jsf:id="txtMoveTo1"
                                        class="btn btn-link text-black"
                                        onclick="document.querySelector('[id$=txtMoveTo2]').style.display='inline';
                                            document.querySelector('[id$=txtMoveTo1]').style.display='none';
                                            document.querySelector('[id$=txtMoveTo2]').focus();
                                            document.querySelector('[id$=txtMoveTo2]').select();">
                                        #{msgs.seite} #{NavigationForm.workflowPlugin.processPaginator.pageNumberCurrent} #{msgs.von}
                                        #{NavigationForm.workflowPlugin.processPaginator.pageNumberLast}</button>

                                    <!-- Seite direkt anspringen -->
                                    <h:inputText
                                        id="txtMoveTo2"
                                        forceId="true"
                                        value="#{NavigationForm.workflowPlugin.processPaginator.txtMoveTo}"
                                        style="display:none;width:30px"
                                        required="true"
                                        onblur="document.querySelector('[id$=txtMoveTo2]').style.display='none';document.querySelector('[id$=txtMoveTo1]').style.display='inline';"
                                        onkeypress="return submitEnter('cmdMoveTo',event)" />
                                    <h:commandButton
                                        action="#{NavigationForm.Reload}"
                                        id="cmdMoveTo"
                                        forceId="true"
                                        value="go"
                                        style="display:none">
                                    </h:commandButton>
                                </div>

                                <button
                                    class="btn btn-primary"
                                    jsf:action="#{NavigationForm.workflowPlugin.processPaginator.cmdMoveNext}"
                                    jsf:id="navnext">
                                    <h:outputText value="#{msgs.pageNext} " />
                                    <span class="fa fa-angle-right"></span>
                                    <f:ajax render="@form" />
                                </button>
                                <button
                                    class="btn btn-blank"
                                    aria-label="#{msgs.lastPage}"
                                    jsf:action="#{NavigationForm.workflowPlugin.processPaginator.cmdMoveLast}"
                                    jsf:id="navlast">
                                    <span class="fa fa-angle-double-right"></span>
                                    <f:ajax render="@form" />
                                </button>
                            </h:panelGroup>

                            <!-- /paginator -->

                        </ui:fragment>
                    </div>
                </section:footer>
                <section:footer>

                    <button
                        class="btn btn-success "
                        aria-label="#{msgs.plugin_workflow_processinspection_executeChance}"
                        jsf:action="#{NavigationForm.workflowPlugin.executeChanges}">
                        <h:outputText value="#{msgs.plugin_workflow_processinspection_executeChance}" />
                        <f:ajax render="@form" />
                    </button>
                </section:footer>
            </section:section>
        </h:form>

        <script type="text/javascript">
            window.onload = function() {
                loadImages();
            }

            faces.ajax.addOnEvent( function( data ) {
                var ajaxstatus = data.status;
                switch ( ajaxstatus ) {
                    case "success":
                        loadImages();
                        break;
                }
            });
        </script>


    </composite:implementation>
</ui:composition>
